name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Pytest & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify Alembic schema
        env:
          JWT_SECRET: test-secret-key-for-ci-runs-only-min-32-chars-long
          ENVIRONMENT: test
          DATABASE_PATH: ${{ runner.temp }}/ci-schema.db
        run: |
          python -m alembic upgrade head
          python - <<'PY'
          import sqlite3
          conn = sqlite3.connect("${{ runner.temp }}/ci-schema.db")
          tables = {
              row[0]
              for row in conn.execute(
                  "SELECT name FROM sqlite_master WHERE type = 'table'"
              )
          }
          assert "parameter_policy" in tables, tables
          PY

      - name: Run backend tests
        env:
          JWT_SECRET: test-secret-key-for-ci-runs-only-min-32-chars-long
          ENVIRONMENT: test
        run: |
          pytest -q

      - name: Validate references (eval gate)
        env:
          JWT_SECRET: test-secret-key-for-ci-runs-only-min-32-chars-long
          ENVIRONMENT: test
        run: |
          python eval/validate.py

      - name: Disruption drill (Red Sea replay)
        # Task 23: scripted disruption scenarios as CI — Suez vs Cape ratios
        # for 3 lane groups must stay inside the UNCTAD-anchored bands
        # (eval/references.yaml). Pure marine-graph computation, no DB.
        run: |
          python scripts/24_red_sea_drill.py

  frontend-test:
    name: Frontend Typecheck & Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run frontend tests (vitest)
        run: npx vitest run

      - name: Build frontend
        run: npm run build

  postgres-suite:
    name: Backend Postgres Integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa_password
          POSTGRES_DB: nexafreight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexafreight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Postgres Integration tests
        env:
          JWT_SECRET: test-secret-key-for-ci-runs-only-min-32-chars-long
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://nexa:nexa_password@localhost:5432/nexafreight
        run: |
          python -m alembic upgrade head
          pytest tests/integration -q

  docker-builds:
    name: Build Docker Images
    needs: [backend-test, frontend-test, postgres-suite]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: false
          tags: nexafreight-backend:latest

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: false
          tags: nexafreight-frontend:latest