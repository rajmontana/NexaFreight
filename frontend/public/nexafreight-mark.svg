<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NexaFreight">
  <!-- NexaFreight mark — Chartroom law: cobalt field, paper monoline NF, route vector -->
  <rect width="512" height="512" rx="88" fill="#2547C8"/>
  <!-- route vector: great-circle hairline + destination node (lower-left) -->
  <path d="M64 448 Q148 436 204 376" fill="none" stroke="#F6F7F4" stroke-width="10" stroke-opacity="0.85" stroke-linecap="round"/>
  <circle cx="212" cy="368" r="15" fill="#F6F7F4" fill-opacity="0.95"/>
  <!-- NF monogram — monoline, square joins (engineering) -->
  <path d="M150 366 L150 150 L252 366 L252 150" fill="none" stroke="#F6F7F4" stroke-width="36" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M404 150 L314 150 L314 366 M314 254 L388 254" fill="none" stroke="#F6F7F4" stroke-width="36" stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
