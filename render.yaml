services:
  - type: web
    name: smarttrack-api
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smarttrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AISSTREAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: smarttrack-db
    plan: free
    region: oregon
